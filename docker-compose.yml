#
# Ci-dessous la config qui permet de lancer ia rameau (4 conteneurs)
#
# Remarque: avant de lancer docker-compose up, il faut régler le fichier .env
# en partant du fichier .env-dist qui donne les variables d'environnements
# à personnaliser et des exemples de valeurs.
#


services:



  indexation-sujet-vectorisation:
    image: abesesr/indexation-sujet:${INDEXATION_SUJET_VECTORISATION_VERSION}
    container_name: indexation-sujet-vectorisation
    restart: unless-stopped
    mem_limit: ${MEM_LIMIT}
    memswap_limit: ${MEM_LIMIT}
    cpus: ${CPU_LIMIT}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
     # TODO verif llm necessaire ou non pour  la vectorisation 
      INDEXATION_SUJET_QDRANT_HOST: ${INDEXATION_SUJET_QDRANT_HOST}
      INDEXATION_SUJET_QDRANT_PORT: ${INDEXATION_SUJET_QDRANT_PORT}
      INDEXATION_SUJET_QDRANT_MIN_VECTORS: ${INDEXATION_SUJET_QDRANT_MIN_VECTORS}
      INDEXATION_SUJET_QDRANT_TEST_LIMIT: ${INDEXATION_SUJET_QDRANT_TEST_LIMIT}

      INDEXATION_SUJET_DOCKER_VOLUME_BIND: ${INDEXATION_SUJET_DOCKER_VOLUME_BIND} 

      INDEXATION_SUJET_VECTORIZE_CONCEPTS_OR_CHAINS: ${INDEXATION_SUJET_VECTORIZE_CONCEPTS_OR_CHAINS}      
      INDEXATION_SUJET_VECTORIZE_AVEC_THESE: ${INDEXATION_SUJET_VECTORIZE_AVEC_THESE} 

      INDEXATION_SUJET_VECTORISATION_HOST: ${INDEXATION_SUJET_VECTORISATION_HOST}
      INDEXATION_SUJET_VECTORISATION_PORT: ${INDEXATION_SUJET_VECTORISATION_PORT}
      INDEXATION_SUJET_DOCKER_NETWORK: ${INDEXATION_SUJET_DOCKER_NETWORK}
      INDEXATION_SUJET_DOCKER_IMAGE_BATCH: ${INDEXATION_SUJET_DOCKER_IMAGE_BATCH}
      INDEXATION_SUJET_DOCKER_SOCK: ${INDEXATION_SUJET_DOCKER_SOCK}
      INDEXATION_SUJET_DOCKER_BATCH_USER : ${INDEXATION_SUJET_DOCKER_BATCH_USER}
      
      ENABLE_GPU: ${ENABLE_GPU}
    depends_on:
      - indexation-sujet-qdrant
    user: root
    ports:
      - ${INDEXATION_SUJET_VECTORISATION_PORT}:${INDEXATION_SUJET_VECTORISATION_PORT}
    volumes: 
      - ./volumes:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks :
      -  ${INDEXATION_SUJET_DOCKER_NETWORK}
    labels:
      # pour envoyer les logs dans le puits de log de l'abes
      - "co.elastic.logs/enabled=true"
      - "co.elastic.logs/processors.add_fields.target="
      - "co.elastic.logs/processors.add_fields.fields.abes_appli=indexation-sujet"
      - "co.elastic.logs/processors.add_fields.fields.abes_middleware=fastapi"
      # pour que les mises à jour de cette image soient auto-déployées par wud
      - "wud.watch=true"
      - "wud.watch.digest=true"

  indexation-sujet-qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    container_name: indexation-sujet-qdrant
    ports:
      - ${INDEXATION_SUJET_QDRANT_PORT}:6333  
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    volumes:
      - ./volumes/qdrant/storage:/qdrant/storage
    networks :
      -  ${INDEXATION_SUJET_DOCKER_NETWORK}
  indexation-sujet-llm:
    image: ollama/ollama:latest
    container_name: indexation-sujet-llm
    restart: unless-stopped
    mem_limit: ${MEM_LIMIT}
    memswap_limit: ${MEM_LIMIT}
    cpus: ${CPU_LIMIT}
    ports:
      - ${INDEXATION_SUJET_LLM_PORT}:11434
    volumes:
      - ./volumes/ollama:/root/.ollama
    networks:
      -  ${INDEXATION_SUJET_DOCKER_NETWORK}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  indexation-sujet-api:
    image: abesesr/indexation-sujet:${INDEXATION_SUJET_API_VERSION}
    container_name: indexation-sujet-api
    restart: unless-stopped
    mem_limit: ${MEM_LIMIT}
    memswap_limit: ${MEM_LIMIT}
    cpus: ${CPU_LIMIT}
    environment:
      INDEXATION_SUJET_API_LLM_URL : ${INDEXATION_SUJET_LLM_URL}
      INDEXATION_SUJET_API_LLM_KEY: ${INDEXATION_SUJET_LLM_KEY}
      INDEXATION_SUJET_API_LLM_MODEL: ${INDEXATION_SUJET_LLM_MODEL}
      INDEXATION_SUJET_QDRANT_HOST: ${INDEXATION_SUJET_QDRANT_HOST}
      INDEXATION_SUJET_QDRANT_PORT: ${INDEXATION_SUJET_QDRANT_PORT}
      INDEXATION_SUJET_API_HTTP_HOST: ${INDEXATION_SUJET_API_HTTP_HOST}
      INDEXATION_SUJET_API_HTTP_PORT: ${INDEXATION_SUJET_API_HTTP_PORT}
      INDEXATION_SUJET_CORS_ORIGINS: ${INDEXATION_SUJET_CORS_ORIGINS}
    ports:
      - ${INDEXATION_SUJET_API_HTTP_PORT}:${INDEXATION_SUJET_API_HTTP_PORT}
    volumes:
      - ./volumes:/app/data:z
    depends_on:
      - indexation-sujet-llm
      - indexation-sujet-qdrant
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks :
      -  ${INDEXATION_SUJET_DOCKER_NETWORK}
    labels:
      # pour envoyer les logs dans le puits de log de l'abes
      - "co.elastic.logs/enabled=true"
      - "co.elastic.logs/processors.add_fields.target="
      - "co.elastic.logs/processors.add_fields.fields.abes_appli=indexation-sujet"
      - "co.elastic.logs/processors.add_fields.fields.abes_middleware=fastapi"
      # pour que les mises à jour de cette image soient auto-déployées par wud
      - "wud.watch=true"
      - "wud.watch.digest=true"

configs:
  qdrant_config:
    content: |
      log_level: INFO

networks : 
  indexation-sujet-network :
    name : ${INDEXATION_SUJET_DOCKER_NETWORK}
    external : true


      